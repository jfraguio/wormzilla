<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wormzilla">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="92%">
      <stop offset="0" stop-color="#0d213c"/>
      <stop offset="0.6" stop-color="#070c19"/>
      <stop offset="1" stop-color="#03050c"/>
    </radialGradient>
    <linearGradient id="worm" x1="86" y1="360" x2="422" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#008cff"/>
      <stop offset="0.42" stop-color="#14f6d2"/>
      <stop offset="0.78" stop-color="#7cffb2"/>
      <stop offset="1" stop-color="#c9ff5a"/>
    </linearGradient>
    <linearGradient id="head" x1="370" y1="200" x2="440" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset="0.32" stop-color="#42ffd8"/>
      <stop offset="1" stop-color="#009bff"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#28f7e0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#28f7e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="270" cy="258" r="190" fill="none" stroke="#3da5d8" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="270" cy="258" r="160" fill="none" stroke="#3da5d8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 15"/>
  <circle cx="356" cy="236" r="150" fill="url(#halo)" filter="url(#soft)"/>

  <g opacity="0.14" fill="#bffcff">
    <circle cx="92" cy="138" r="3"/>
    <circle cx="414" cy="108" r="2"/>
    <circle cx="448" cy="390" r="2.6"/>
    <circle cx="120" cy="420" r="2"/>
    <circle cx="312" cy="90" r="1.8"/>
    <circle cx="176" cy="82" r="2.2"/>
  </g>

  <path d="M107 346 C 166 250, 233 394, 302 302 C 344 248, 382 250, 405 262"
        fill="none" stroke="#02131d" stroke-opacity="0.85" stroke-width="70" stroke-linecap="round"/>
  <path d="M107 346 C 166 250, 233 394, 302 302 C 344 248, 382 250, 405 262"
        fill="none" stroke="url(#worm)" stroke-width="52" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M112 322 C 164 246, 229 374, 297 290 C 333 244, 373 240, 399 246"
        fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round"/>

  <g>
    <circle cx="410" cy="258" r="53" fill="#02131d" fill-opacity="0.55"/>
    <circle cx="410" cy="258" r="46" fill="url(#head)" filter="url(#glow)"/>
    <ellipse cx="421" cy="243" rx="11.5" ry="14" fill="#f4ffff"/>
    <ellipse cx="394" cy="253" rx="11.5" ry="14" fill="#f4ffff"/>
    <circle cx="425" cy="245" r="6.2" fill="#04151a"/>
    <circle cx="398" cy="255" r="6.2" fill="#04151a"/>
    <circle cx="423" cy="241.5" r="2" fill="#ffffff"/>
    <circle cx="396" cy="251.5" r="2" fill="#ffffff"/>
  </g>

  <path d="M170 356 C 200 362, 224 355, 242 341" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="5" stroke-linecap="round"/>
  <path d="M252 352 C 278 350, 296 338, 309 322" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" stroke-linecap="round"/>
</svg>
